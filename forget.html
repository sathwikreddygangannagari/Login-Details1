<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Forget Password</h1>
    <h3 align="center">Enter your email to reset your password</h3>
    <center>
    <label for="email">Email : </label>
    <input type="email" id="email" name="email" placeholder="Email" pattern="[a-zA-Z0-9._%+-]+@(gmail|yahoo|outlook)\.(com|in|org)" required="">
    <br>
    <br>
    
    <button type="submit">Reset Password</button>
    </center>   
</body>
</html>
